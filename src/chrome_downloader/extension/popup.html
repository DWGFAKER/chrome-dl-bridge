<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>下载桥状态</title>
<style>
  /* 老奶奶友好：字号大、按钮大、一屏一件事 */
  body { font: 15px/1.6 "Microsoft YaHei", system-ui, sans-serif; margin: 0;
         width: 340px; padding: 14px 16px 16px; color: #202124; background: #fff; }
  h1 { font-size: 16px; margin: 0 0 10px; font-weight: 600; }
  .led { display: flex; align-items: center; gap: 8px; font-size: 15px; margin-bottom: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .on  { background: #1a9d54; }
  .off { background: #f0a202; }
  .bad { background: #d93025; }
  /* 提示条：需要人看一眼的时候出现在第一屏 */
  .notice { border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; font-size: 14.5px; }
  .notice.red    { background: #fce8e6; color: #8a1c12; border: 1px solid #f5c0ba; }
  .notice.yellow { background: #fef7e0; color: #6b4e00; border: 1px solid #f3e0a6; }
  .notice.gray   { background: #f1f3f4; color: #3c4043; border: 1px solid #dadce0; }
  .notice .why { color: #5f6368; font-size: 12.5px; margin-top: 6px; word-break: break-all; }
  .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { font-size: 15px; padding: 9px 14px; border-radius: 6px; border: 1px solid #1a73e8;
           background: #1a73e8; color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: #1a73e8; }
  button:active { opacity: .8; }
  dl { margin: 0 0 10px; font-size: 13px; }
  dl div { display: flex; justify-content: space-between; gap: 10px;
           border-bottom: 1px dashed #eee; padding: 3px 0; }
  dt { color: #5f6368; } dd { margin: 0; font-family: ui-monospace, Consolas, monospace;
           overflow-wrap: anywhere; text-align: right; }
  .hint { font-size: 12.5px; color: #5f6368; margin-top: 8px; }
</style>
</head>
<body>
  <h1>下载桥</h1>
  <div class="led"><span id="dot" class="dot off"></span><span id="ledText">正在问…</span></div>

  <div id="notice" class="notice gray" hidden>
    <div id="noticeText"></div>
    <div class="why" id="noticeWhy"></div>
    <div class="btns" id="noticeBtns"></div>
  </div>

  <dl>
    <div><dt>内部门牌</dt><dd id="port">—</dd></div>
    <div><dt>对端编号</dt><dd id="bridgeId">—</dd></div>
    <div><dt>对端进程号</dt><dd id="peerPid">—</dd></div>
    <div><dt>本机 Chrome</dt><dd id="chrome">—</dd></div>
    <div><dt>在跟的任务</dt><dd id="tasks">—</dd></div>
  </dl>

  <div class="btns">
    <button id="reconnect">立即重连</button>
    <button id="forget" class="ghost">断开并忘记此程序</button>
  </div>
  <p class="hint">装完就能用，什么都不用填。机器人什么时候想下东西，插件敲几下门就接上了
     （插件睡着时最多约半分钟，Chrome 官方定的最快 30 秒）。</p>
  <script src="popup.js"></script>
</body>
</html>
